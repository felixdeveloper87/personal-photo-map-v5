map $http_x_forwarded_proto $redirect_to_https {
  default          0;
  "https"          0;
  "http"           1;
}

server {
  listen 80;
  server_name api.personalphotomap.co.uk; # domínio da API

  # Redireciona para HTTPS (inclusive quando atrás do Cloudflare)
  if ($redirect_to_https) {
    return 301 https://$host$request_uri;
  }

  location /.well-known/acme-challenge/ {
    # Caso opte por emitir LE via HTTP-01 no futuro
    root /var/www/html;
  }
}

server {
  listen 443 ssl http2;
  server_name api.personalphotomap.co.uk; # domínio da API

  ssl_certificate     /etc/nginx/certs/origin.crt;   # Cloudflare Origin CA cert
  ssl_certificate_key /etc/nginx/certs/origin.key;   # Chave privada

  include /etc/nginx/snippets/ssl.conf;

  location / {
    proxy_pass http://backend:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}
