map $http_x_forwarded_proto $redirect_to_https {
  default          0;
  "https"          0;
  "http"           1;
}

server {
  listen 80;
  listen [::]:80;
  server_name api.personalphotomap.co.uk; # dominio da API

  include /etc/nginx/snippets/cloudflare-real-ip.conf;

  # Redirects everything to HTTPS (works even behind Cloudflare)
  if ($redirect_to_https) {
    return 301 https://$host$request_uri;
  }

  location /.well-known/acme-challenge/ {
    # In case you issue Let's Encrypt via HTTP-01 later
    root /var/www/html;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name api.personalphotomap.co.uk; # dominio da API

  http2 on;
  include /etc/nginx/snippets/cloudflare-real-ip.conf;

  ssl_certificate     /etc/nginx/certs/origin.crt;   # Cloudflare Origin CA cert
  ssl_certificate_key /etc/nginx/certs/origin.key;   # Private key

  include /etc/nginx/snippets/ssl.conf;

  # Upload size limits
  client_max_body_size 100M;
  client_body_timeout 60s;
  client_header_timeout 60s;

  # CORS headers
  add_header 'Access-Control-Allow-Origin' 'https://www.personalphotomap.co.uk' always;
  add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
  add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
  add_header 'Access-Control-Allow-Credentials' 'true' always;

  # Handle preflight requests
  location / {
    # Handle OPTIONS requests for CORS preflight
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' 'https://www.personalphotomap.co.uk' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Max-Age' 1728000;
      add_header 'Content-Type' 'text/plain; charset=utf-8';
      add_header 'Content-Length' 0;
      return 204;
    }

    # Upload size and timeout settings
    client_max_body_size 100M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    proxy_send_timeout 300s;

    proxy_pass http://backend:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}