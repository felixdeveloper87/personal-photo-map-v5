map $http_x_forwarded_proto $redirect_to_https {
  default          0;
  "https"          0;
  "http"           1;
}

server {
  listen 80;
  listen [::]:80;
  server_name api.personalphotomap.co.uk; # dominio da API

  include /etc/nginx/snippets/cloudflare-real-ip.conf;

  # Redirects everything to HTTPS (works even behind Cloudflare)
  if ($redirect_to_https) {
    return 301 https://$host$request_uri;
  }

  location /.well-known/acme-challenge/ {
    # In case you issue Let's Encrypt via HTTP-01 later
    root /var/www/html;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name api.personalphotomap.co.uk; # dominio da API

  http2 on;
  include /etc/nginx/snippets/cloudflare-real-ip.conf;

  ssl_certificate     /etc/nginx/certs/origin.crt;   # Cloudflare Origin CA cert
  ssl_certificate_key /etc/nginx/certs/origin.key;   # Private key

  include /etc/nginx/snippets/ssl.conf;

  # Upload size limits (increased for large batches)
  client_max_body_size 500M;
  client_body_timeout 300s;
  client_header_timeout 300s;

  # CORS headers are handled by Spring Boot to avoid duplicates

  # Proxy all requests to Spring Boot (handles CORS internally)
  location / {
    # Proxy timeout settings (increased for large uploads)
    proxy_read_timeout 600s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 600s;

    proxy_pass http://backend:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}