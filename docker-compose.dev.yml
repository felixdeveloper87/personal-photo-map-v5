services:
  # Comandos úteis:
  #   docker compose -f docker-compose.dev.yml up
  #   docker compose -f docker-compose.dev.yml up -d
  #   docker compose -f docker-compose.dev.yml down
  #   docker compose -f docker-compose.dev.yml logs -f
  #   docker compose -f docker-compose.dev.yml up -d --build

  # Database PostgreSQL
  # ===================
  db:
    image: postgres:16
    container_name: photomap-db-dev
    environment:
      POSTGRES_DB: ${DB_NAME:-photomap}
      POSTGRES_USER: ${DB_USER:-photomap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-photomap123}
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-photomap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - photomap-network

  # Backend Spring Boot
  # ===================
  backend:
    build:
      context: ./backend/photo-map
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=development
    container_name: photomap-backend-dev
    ports:
      - "8092:8092"
    environment:
      # Database
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME:-photomap}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-photomap}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-photomap123}
      
      # Server
      - SERVER_ADDRESS=0.0.0.0
      - SERVER_PORT=8092
      
      # App config
      - APP_UPLOAD_DIR=/photomap/storage/uploads
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8092}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8092}
      
      # JWT
      - JWT_SECRET=${JWT_SECRET:-mySecretKey123456789012345678901234567890123456789012345678901234567890}
      
      # Java optimization for dev
      - JAVA_OPTS=-Xmx1g -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    volumes:
      - ./storage:/photomap/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - photomap-network

  # Frontend React/Vite com Hot Reload
  # ==================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        - BUILD_ENV=development
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8092}
    container_name: photomap-frontend-dev
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8092}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/package.json:/app/package.json
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - photomap-network
    stdin_open: true
    tty: true

volumes:
  dbdata:

networks:
  photomap-network:
    name: photomap-dev-network
    driver: bridge
