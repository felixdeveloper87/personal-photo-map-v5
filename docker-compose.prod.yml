services:
  # Comandos úteis:
  #   docker compose -f docker-compose.prod.yml down
  #   docker compose -f docker-compose.prod.yml up -d --build
  #   docker compose -f docker-compose.prod.yml up -d
  #   docker compose -f docker-compose.prod.yml build backend
  #   docker compose -f docker-compose.prod.yml up -d --build backend
 
  #   docker compose -f docker-compose.prod.yml logs -f

  # Database PostgreSQL
  # ===================
  db:
    image: postgres:16
    container_name: photomap-db-prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - photomap-network

  # Backend Spring Boot
  # ===================
  backend:
    build:
      context: ./backend/photo-map
      dockerfile: Dockerfile
    container_name: photomap-backend-prod
    env_file:
      - env.prod
    ports:
      - "8092:8080"
    environment:
      # Database
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      
      # Server
      - SERVER_ADDRESS=0.0.0.0
      - SERVER_PORT=8080
      
      # App config
      - UPLOAD_DIR=/photomap/storage/uploads
      - APP_BASE_URL=${APP_BASE_URL}
      - BACKEND_URL=${BACKEND_URL}
      
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      
      # OpenAI API (for generating country curiosities)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # Cloudinary configuration (external image processing)
      - CLOUDINARY_ENABLED=${CLOUDINARY_ENABLED:-true}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      
      # Java optimization for production (reduced for 1.8GB VPS + Cloudinary offloads processing)
      - JAVA_OPTS=-Xmx1g -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:+OptimizeStringConcat -XX:MaxMetaspaceSize=256m
    volumes:
      - ./storage:/photomap/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - photomap-network

volumes:
  dbdata:

networks:
  photomap-network:
    name: photomap-prod-network
    driver: bridge




