# Application name
spring.application.name=Photo Map Application

# Database configuration (using environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.datasource.initialization-mode=always
# Headers configuration for Cloudflare
server.forward-headers-strategy=native
server.tomcat.remote-ip-header=CF-Connecting-IP
server.tomcat.protocol-header=CF-Visitor
server.tomcat.protocol-header-https-value=https
server.tomcat.use-forward-headers=true


# Local file storage configuration
app.upload.dir=${UPLOAD_DIR:/photomap/storage/uploads/}
app.base.url=${BASE_URL:http://localhost:8092}

# JWT configuration
jwt.secret=${JWT_SECRET}

# Backend configuration (fallback localhost, usado só em dev)
backend.url=${BACKEND_URL:http://localhost:8092}

# Upload configuration optimized for low memory VPS
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Image processing configuration
app.image.max-size=1920
app.image.max-file-size-mb=3
app.image.initial-quality=0.8
app.image.min-quality=0.5

# Force passthrough for ALL uploads (no processing at all)
app.images.passthrough=true
app.image.force-passthrough=true

# Async configuration optimized for low memory VPS (1.8GB RAM)
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=2
spring.task.execution.pool.queue-capacity=10
spring.task.execution.thread-name-prefix=upload-

# Server timeout configuration for low memory
server.tomcat.connection-timeout=30000
server.tomcat.keep-alive-timeout=15000
server.tomcat.max-connections=50

# Server port (use EB port 5000)
server.port=${PORT:5000}




