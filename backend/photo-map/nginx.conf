server {
    listen 443 ssl;
    server_name api.personalphotomap.co.uk;

    ssl_certificate /etc/letsencrypt/live/api.personalphotomap.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.personalphotomap.co.uk/privkey.pem;

    # Upload size limits optimized for low memory VPS
    client_max_body_size 50M;
    client_body_timeout 120s;
    client_header_timeout 60s;

    # CORS headers removidos - Spring Boot gerencia CORS
    # O Spring Boot SecurityConfig.java já configura CORS adequadamente

    # Location específica para imagens - Spring Boot gerencia CORS
    location /api/images/uploads/ {
        proxy_pass http://localhost:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Upload size and timeout settings for all API endpoints - optimized for low memory VPS
        client_max_body_size 50M;
        proxy_read_timeout 180s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 180s;

        proxy_pass http://localhost:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.personalphotomap.co.uk;
    return 301 https://$host$request_uri;
}
