services:
  postgres-container:
    image: postgres:16
    container_name: postgres-container
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: 
      context: ./backend/photo-map
      dockerfile: Dockerfile.dev
    container_name: photomap-backend
    env_file: .env
    environment:
      - SERVER_ADDRESS=0.0.0.0
      - SERVER_PORT=8092
      - APP_UPLOAD_DIR=/photomap/storage
      - APP_BASE_URL=https://api.personalphotomap.co.uk
    ports:
      - "8092:8092"
    volumes:
      - photomap-storage:/photomap/storage
    depends_on:
      - postgres-container

  nginx:
    image: nginx:alpine
    container_name: photomap-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    restart: unless-stopped


volumes:
  postgres-data:
  photomap-storage:

